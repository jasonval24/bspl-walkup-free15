<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Free 15-minute ride | Blue Shore Pedal Lounge</title>
  <style>
    body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;background:#0b1220;color:#fff;padding:20px}
    .card{width:100%;max-width:400px}
    h1{font-size:1.5rem;margin:0 0 8px}
    p{color:#c5d0e0;margin:0 0 18px}
    label{display:block;margin:0 0 6px;font-size:.9rem}
    input{width:100%;box-sizing:border-box;padding:14px;margin:0 0 14px;border-radius:10px;
      border:1px solid #334;background:#111827;color:#fff;font-size:16px}
    button{width:100%;padding:14px;border:0;border-radius:999px;font-weight:700;font-size:1rem;
      background:#5b9cff;color:#fff;cursor:pointer}
    #msg{margin-top:14px;display:none}
    #msg.show{display:block}
  </style>
</head>
<body>
  <main class="card">
    <h1>Free 15-minute ride</h1>
    <p>Enter your name and phone — it's on us.</p>
    <form id="f">
      <label for="name">Full name</label>
      <input id="name" name="name" required autocomplete="name" />
      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" required autocomplete="tel" />
      <button type="submit">Claim my free ride</button>
    </form>
    <p id="msg">You're in — show staff this text.</p>
  </main>
  <script>
    const HOOK='https://hook.us2.make.com/nok2t3v9tdl8wm62awh5zhu5pugdwq8c';
    document.getElementById('f').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const name=document.getElementById('name').value.trim();
      const phone=document.getElementById('phone').value.trim();
      try{
        await fetch(HOOK,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name,phone,fullName:name,source:'walk-up'})});
      }catch(_){}
      document.getElementById('msg').classList.add('show');
    });
  </script>
</body>
</html>
