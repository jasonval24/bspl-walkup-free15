<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Free 15-minute ride | Blue Shore Pedal Lounge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f, #0b1220 55%, #05080f);
      color: #f4f7fb; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 28px 22px 24px; backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .brand { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #8eb6ff; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; line-height: 1.15; }
    .sub { margin: 0 0 22px; color: #c5d0e0; font-size: 1rem; line-height: 1.4; }
    label { display: block; font-size: 0.85rem; margin: 0 0 6px; color: #d7e2f2; }
    input {
      width: 100%; padding: 14px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35); color: #fff; font-size: 16px; margin-bottom: 14px;
    }
    input:focus { outline: 2px solid #5b9cff; border-color: transparent; }
    button {
      width: 100%; margin-top: 6px; padding: 15px; border: 0; border-radius: 999px; font-size: 1.05rem; font-weight: 700;
      background: linear-gradient(135deg, #5b9cff, #7a5cff); color: #fff; cursor: pointer;
    }
    .fine { margin-top: 14px; font-size: 0.75rem; color: #8a97ab; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Blue Shore Pedal Lounge</div>
    <h1>Free 15-minute ride</h1>
    <p class="sub">Scan, enter your name and phone — it's on us.</p>
    <form method="POST" action="https://hook.us2.make.com/nok2t3v9tdl8wm62awh5zhu5pugdwq8c" id="f">
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" autocomplete="name" required placeholder="First Last" />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="(361) 555-0123" />
      <input type="hidden" name="source" value="walk-up" />
      <button type="submit">Claim free ride</button>
    </form>
    <p class="fine">Booth / walk-up only · Not for website ads</p>
  </main>
</body>
</html>
